# Production Nginx config for freelance.illustrates.dev
# SSL termination, reverse proxy (API + Web), rate limiting, security hardening

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ───────────────────────── Logging ─────────────────────────
  log_format json_combined escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"referrer":"$http_referer",'
    '"ua":"$http_user_agent",'
    '"duration":$request_time,'
    '"upstream":"$upstream_response_time"}';

  access_log /var/log/nginx/access.log json_combined;

  # ───────────────────────── Performance ─────────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  keepalive_timeout 65;
  keepalive_requests 1000;

  server_tokens off;

  # ───────────────────────── Gzip ─────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1000;

  gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/rss+xml image/svg+xml;

  # ───────────────────────── Rate limiting ─────────────────────────
  limit_req_zone $binary_remote_addr zone=api:20m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=general:20m rate=120r/m;
  limit_req_zone $binary_remote_addr zone=static:10m rate=300r/m;

  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # ───────────────────────── Real IP ─────────────────────────
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # ───────────────────────── Upstreams ─────────────────────────
  upstream api {
    server api:5001;
    keepalive 64;
  }

  upstream web {
    server web:3000;
    keepalive 64;
  }

  # ───────────────────────── HTTP → HTTPS ─────────────────────────
  server {
    listen 80;
    server_name freelance.illustrates.dev;

    return 301 https://$host$request_uri;
  }

  # ───────────────────────── HTTPS SERVER ─────────────────────────
  server {
    listen 443 ssl http2;
    server_name freelance.illustrates.dev;

    ssl_certificate     /etc/letsencrypt/live/freelance.illustrates.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freelance.illustrates.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # ───── Security headers ─────
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ───── Connection limiting ─────
    limit_conn conn_limit 20;

    # ───── Health check ─────
    location = /nginx-health {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # ───────────────────────── API ─────────────────────────
    location /api/ {
      limit_req zone=api burst=30 nodelay;
      limit_conn conn_limit 20;

      proxy_pass http://api;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;

      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # Auth endpoints (stricter)
    location ~ ^/api/v1/(auth|users/me)(/|$) {
      limit_req zone=auth burst=5 nodelay;

      proxy_pass http://api;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Webhooks (no buffering)
    location /webhooks/ {
      proxy_pass http://api/webhooks/;

      proxy_buffering off;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Metrics (internal only)
    location /metrics {
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      deny all;

      proxy_pass http://api/metrics;
    }

    # ───────────────────────── MinIO Storage ─────────────────────────
    location /storage/ {
      proxy_pass http://minio:9000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
    }

    # ───────────────────────── Frontend ─────────────────────────

    location /_next/static/ {
      limit_req zone=static burst=100 nodelay;

      proxy_pass http://web;

      add_header Cache-Control "public, immutable, max-age=31536000";
    }

    location /favicon.ico {
      proxy_pass http://web;
      add_header Cache-Control "public, max-age=86400";
      access_log off;
    }

    location / {
      limit_req zone=general burst=40 nodelay;
      limit_conn conn_limit 20;

      proxy_pass http://web;
      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;

      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }
  }
}